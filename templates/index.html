        <script>
          var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          var recognition = SpeechRec ? new SpeechRec() : null;
      
          function displayFullName() {
              var input = document.getElementById("t2").value;
              sendData(input);
          }
      
          function sendData(input) {
              var request = new XMLHttpRequest();
              var data = "You: " + input + "\n";
              request.open("GET", "/predict?mytext=" + encodeURIComponent(input));
              request.onreadystatechange = function() {
                  if (this.readyState === 4 && this.status === 200) {
                      data += "Chatbot: " + JSON.parse(this.responseText)["response"] + "\n";
                      document.getElementById("t1").value += data;
                      document.getElementById("t2").value = "";
                  }
              };
              request.send();
          }
      
          function startListening() {
              if (!recognition) { alert("Speech recognition is not supported in this browser. Try Chrome."); return; }
              recognition.start();
              recognition.onresult = function(event) {
                  var transcript = event.results[0][0].transcript;
                  document.getElementById("t2").value = transcript;
                  sendData(transcript);
              };
          }
      </script>
